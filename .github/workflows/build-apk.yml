name: Unzip and Build APK

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip uploaded parts (part1.zip, part2.zip ...)
        run: |
          found=0
          while IFS= read -r z; do
            [ -z "$z" ] && continue
            found=1
            echo "Extracting $z"
            unzip -o -q "$z" -x '__MACOSX/*' '.github/*'
            rm -f "$z"
          done < <(ls -1 *.zip 2>/dev/null | sort -V)
          if [ "$found" = "1" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unzip uploaded parts" || true
            git push || true
          fi
          test -f package.json || { echo "package.json not found. Upload part1.zip first."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and prepare
        run: |
          npm install
          node scripts/prepare.js

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            mkdir -p $R/mipmap-$d
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert app/icon-512.png -resize ${s}x${s} $R/mipmap-$d/$n.png
            done
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nabz-aasan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nabz-aasan-apk
          path: nabz-aasan.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Nabz Aasan APK ${{ github.run_number }}
          files: nabz-aasan.apk
